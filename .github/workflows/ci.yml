name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The two halves of this monorepo have independent toolchains (Python package
# in analysis/, Next.js app in tracker/) and no shared build graph, so they run
# as separate jobs rather than through a JS workspace runner. Paths filters keep
# a tracker-only change from spending time on the Python suite and vice versa.
jobs:
  analysis:
    name: analysis (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install analysis package
        working-directory: analysis
        run: pip install -e ".[dev]"

      # Both findings that kept this out of the gate are now fixed: the import
      # ordering, and the blind `except Exception` in the bootstrap resampler,
      # which is now narrowed to the two errors a case resample can genuinely
      # raise. A blind except there would have swallowed a typo in the predictor
      # list and returned an all-NaN table looking like an unstable coefficient.
      - name: Lint
        working-directory: analysis
        run: ruff check src tests scripts

      # The SRI source workbook is gitignored, so `make build` cannot run in CI.
      # The committed data/state_data_full.csv is what the tests and the
      # tracker's refit both consume, so the suite is still meaningful here.
      - name: Test
        working-directory: analysis
        run: python -m pytest -v

      # The nightly refresh runs this first and exits on it, so a failure here
      # used to surface only as a broken scheduled job hours later. One absent
      # credit score was enough to break it for a week. Running it in CI against
      # the committed dataset catches that on the commit that causes it.
      - name: Refit model (smoke test)
        working-directory: tracker
        run: python scripts/refit_model.py --out /tmp/model.json

  tracker:
    name: tracker (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tracker/package-lock.json

      - name: Install dependencies
        working-directory: tracker
        run: npm ci

      - name: Typecheck
        working-directory: tracker
        run: npm run typecheck

      - name: Lint
        working-directory: tracker
        run: npm run lint

      - name: Test
        working-directory: tracker
        run: npm test

      # Builds with whatever data files are committed — including none, which
      # is the case on a fresh clone. loadSnapshot() returning null and pages
      # falling back to AwaitingData is required behaviour, so a build that
      # survives absent data is exactly what this step verifies.
      - name: Build
        working-directory: tracker
        run: npx next build
